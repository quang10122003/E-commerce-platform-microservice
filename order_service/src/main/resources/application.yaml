spring:
  config:
    import:
      - optional:file:.env[.properties]
  profiles:
    # Mặc định chạy local; Docker truyền SPRING_PROFILES_ACTIVE=docker.
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: order-service
  servlet:
    multipart:
      # Tối đa 5 ảnh đánh giá, mỗi ảnh 15MB, cộng phần dữ liệu form.
      max-file-size: 15MB
      max-request-size: 76MB
  cloud:
    loadbalancer:
      cache:
        # Giữ TTL ngắn tương ứng chu kỳ lấy registry để không gọi vào instance cũ quá lâu.
        ttl: 10s
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        linger.ms: 5
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    username: ${USERNAME_DATABASE}
    password: ${PASSWORD_DATABASE}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+07:00'"
  jpa:
    properties:
      hibernate:
        # Hibernate mặc định ghi Instant theo giờ UTC, lệch với phiên MySQL +07 ở trên; ép cùng múi giờ.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  prometheus:
    metrics:
      export:
        # Mặc định đã bật khi có micrometer-registry-prometheus; ghi rõ để dễ nhận biết và tắt riêng khi cần.
        enabled: true
  metrics:
    tags:
      # Gắn tên service vào mọi số liệu để Prometheus và Grafana lọc theo từng service.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Xuất histogram để tính được độ trễ p95/p99 trên Prometheus.
        "[http.server.requests]": true
  endpoint:
    health:
      # Hiện trạng thái từng indicator để biết ngay nguyên nhân DOWN; vẫn giấu chi tiết để không lộ cấu hình hạ tầng.
      show-components: always
      show-details: never
      group:
        eureka:
          # Chỉ MySQL là dependency nên chỉ db quyết định trạng thái trên Eureka; không có thành phần optional.
          include:
            - db
            - diskSpace
            - ping

server:
  port: 8084

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    # Lấy registry thường xuyên hơn để phía gọi sớm bỏ instance đã DOWN hoặc đã tắt.
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    metadata-map:
      # Prometheus đọc metadata này từ Eureka để biết đường dẫn lấy số liệu của instance.
      "[prometheus.path]": /actuator/prometheus
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  vnpay:
    payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    return-url: ${FE_HOST}/checkout/success
    version: 2.1.0
    command: pay
    currency: VND
    locale: vn
    order-type: other
    # Số phút link thanh toán VNPay còn hiệu lực trước khi đơn bị hủy.
    timeout-minutes: 15
    query-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
    # Chờ thêm sau expires_at vì IPN có thể về trễ trước khi tự hỏi QueryDR.
    reconcile-grace-minutes: ${VNPAY_RECONCILE_GRACE_MINUTES:15}
    reconcile-fixed-delay-ms: 60000
  order:
    # Đơn đang giao quá số giờ này kể từ lúc giao cho đơn vị vận chuyển thì job tự chuyển sang hoàn thành.
    auto-complete-after-hours: 24
    auto-complete-fixed-delay-ms: 300000
  kafka:
    consumer:
      retry-interval-ms: 60000
      retry-increment-ms: 300000
      max-retries: 3
      dlt-partitions: 3
      dlt-replicas: 1
  outbox:
    fixed-delay-ms: 2000
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_SECRET_KEY}
