spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: order-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        linger.ms: 5
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: jdbc:mysql://localhost:3306/order_service_db
    username: ${USERNAME_DATABASE}
    password: ${PASSWORD_DATABASE}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+07:00'"

server:
  port: 8084

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  kafka:
    consumer:
      retry-interval-ms: ${ORDER_KAFKA_RETRY_INTERVAL_MS:60000}
      retry-increment-ms: ${ORDER_KAFKA_RETRY_INCREMENT_MS:300000}
      max-retries: ${ORDER_KAFKA_MAX_RETRIES:3}
      dlt-partitions: ${ORDER_KAFKA_DLT_PARTITIONS:3}
      dlt-replicas: ${ORDER_KAFKA_DLT_REPLICAS:1}
  outbox:
    fixed-delay-ms: ${ORDER_OUTBOX_FIXED_DELAY_MS:5000}
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
