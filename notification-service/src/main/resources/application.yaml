server:
  port: 8082
spring:
  config:
    import:
      # Nạp biến môi trường từ .env ở cả root project và thư mục cha của module
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/notifiservice_db
    username: ${USERNAME_DATABASE}
    password: ${PASSWORD_DATABASE}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+07:00'"
  application:
    name: notification-service
  # Dùng cùng cấu hình Redis và StringRedisTemplate như gateway.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        # Chờ tối đa 5 mili giây để gom thêm message cùng partition.
        linger.ms: 5
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    # Rút ngắn thời gian chờ để Eureka bỏ instance đã tắt nhanh hơn.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
app:
  kafka:
    consumer:
      retry-interval-ms: ${NOTIFICATION_KAFKA_RETRY_INTERVAL_MS:60000}
      retry-increment-ms: ${NOTIFICATION_KAFKA_RETRY_INCREMENT_MS:300000}
      max-retries: ${NOTIFICATION_KAFKA_MAX_RETRIES:3}
      dlt-partitions: ${NOTIFICATION_KAFKA_DLT_PARTITIONS:3}
      dlt-replicas: ${NOTIFICATION_KAFKA_DLT_REPLICAS:1}
  websocket:
    ticket-ttl-seconds: 30
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
  mail:
    welcome-sender: welcome@daoxuanquang.dev
  resend:
    resend_key: ${RESEND_KEY}
