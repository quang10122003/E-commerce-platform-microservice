server:
  port: 8082
spring:
  config:
    import:
      - optional:file:.env[.properties]
  profiles:
    # Mặc định chạy local; Docker truyền SPRING_PROFILES_ACTIVE=docker.
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    username: ${USERNAME_DATABASE}
    password: ${PASSWORD_DATABASE}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+07:00'"
  jpa:
    properties:
      hibernate:
        # Hibernate mặc định ghi Instant theo giờ UTC, lệch với phiên MySQL +07 ở trên; ép cùng múi giờ.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  application:
    name: notification-service
  cloud:
    loadbalancer:
      cache:
        # Giữ TTL ngắn tương ứng chu kỳ lấy registry để không gọi vào instance cũ quá lâu.
        ttl: 10s
  # Dùng cùng cấu hình Redis và StringRedisTemplate như gateway.
  data:
    redis:
      timeout: 2s
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        # Chờ tối đa 5 mili giây để gom thêm message cùng partition.
        linger.ms: 5
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  prometheus:
    metrics:
      export:
        # Mặc định đã bật khi có micrometer-registry-prometheus; ghi rõ để dễ nhận biết và tắt riêng khi cần.
        enabled: true
  metrics:
    tags:
      # Gắn tên service vào mọi số liệu để Prometheus và Grafana lọc theo từng service.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Xuất histogram để tính được độ trễ p95/p99 trên Prometheus.
        "[http.server.requests]": true
  endpoint:
    health:
      # Hiện trạng thái từng indicator để biết ngay nguyên nhân DOWN; vẫn giấu chi tiết để không lộ cấu hình hạ tầng.
      show-components: always
      show-details: never
      group:
        eureka:
          # Redis chỉ giữ vé WebSocket nên lỗi không được kéo cả service DOWN trên Eureka.
          include:
            - db
            - diskSpace
            - ping
        optional:
          # Thành phần không bắt buộc, chỉ để UI giám sát hiển thị; không ảnh hưởng trạng thái Eureka.
          include:
            - redis

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    # Lấy registry thường xuyên hơn để phía gọi sớm bỏ instance đã DOWN hoặc đã tắt.
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    metadata-map:
      # Prometheus đọc metadata này từ Eureka để biết đường dẫn lấy số liệu của instance.
      "[prometheus.path]": /actuator/prometheus
    # Rút ngắn thời gian chờ để Eureka bỏ instance đã tắt nhanh hơn.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
app:
  sse:
    connection-timeout-ms: 300000
    heartbeat-interval-ms: 15000
    replay-ttl-ms: 300000
    replay-max-events: 100
  kafka:
    consumer:
      retry-interval-ms: 60000
      retry-increment-ms: 300000
      max-retries: 3
      dlt-partitions: 3
      dlt-replicas: 1
  websocket:
    ticket-ttl-seconds: 30
    allowed-origins: ${FE_HOST}
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
  mail:
    welcome-sender: welcome@daoxuanquang.dev
    order-sender: order@daoxuanquang.dev
  resend:
    resend_key: ${RESEND_KEY}
