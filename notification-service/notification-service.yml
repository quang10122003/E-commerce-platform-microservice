# Chạy riêng service: docker compose -f notification-service/notification-service.yml up -d --build
services:
  notification-service:
    build:
      # Context là gốc repo để Dockerfile copy được module common.
      context: ..
      dockerfile: notification-service/Dockerfile
    image: ecommerce/notification-service:latest
    container_name: ecom-notification-service
    env_file: .env
    environment:
      # Ghi đè giá trị local trong .env để service dùng địa chỉ container trong application-docker.yaml.
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    networks:
      - ecommerce-net
    # Tự khởi động lại khi bật lên lúc MySQL, Kafka hay Eureka chưa sẵn sàng.
    deploy:
      resources:
        limits:
          # Chặn một JVM chiếm quá nhiều RAM khi chạy cả hệ thống trên máy dev.
          memory: 768m
    restart: on-failure

networks:
  # Khai báo giống infra: chạy chung thì gộp một mạng, chạy riêng thì dùng lại mạng đã có hoặc tự tạo.
  ecommerce-net:
    name: ecommerce-net
    driver: bridge
