services:
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ecom-ngrok
    command: http host.docker.internal:8080
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Thiếu NGROK_AUTHTOKEN trong infra/.env}
    ports:
      - "4040:4040"
    # Docker Desktop đã có sẵn host.docker.internal; dòng này để Linux cũng gọi được gateway chạy trên máy thật.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecommerce-net
    restart: unless-stopped

networks:
  # Mọi file thành phần khai báo giống nhau để compose gộp thành một mạng chung.
  ecommerce-net:
    name: ecommerce-net
    driver: bridge
