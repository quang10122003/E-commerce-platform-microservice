services:
  mysql:
    image: mysql:8.4
    container_name: ecom-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD trong infra/.env}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Chỉ chạy khi volume dữ liệu còn trống, tức lần khởi tạo đầu tiên.
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Lần đầu còn chạy init.sql nên cho thêm thời gian trước khi tính lỗi.
      start_period: 60s
    restart: unless-stopped

volumes:
  # Dùng lại volume của container MySQL hiện tại để giữ nguyên dữ liệu.
  mysql-data:
    name: mysql-data

networks:
  # Mọi file thành phần khai báo giống nhau để compose gộp thành một mạng chung.
  ecommerce-net:
    name: ecommerce-net
    driver: bridge
