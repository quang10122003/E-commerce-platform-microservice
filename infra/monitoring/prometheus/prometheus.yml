global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Lấy danh sách instance từ Eureka nên thêm, bớt hay đổi cổng service không phải sửa file này.
  - job_name: eureka-services
    # Service đã tự gắn nhãn application qua management.metrics.tags; giữ nhãn đó thay vì đổi thành exported_application.
    honor_labels: true
    eureka_sd_configs:
      - server: http://host.docker.internal:8761/eureka
        refresh_interval: 15s
    relabel_configs:
      # Chỉ lấy instance khai báo metadata prometheus.path trong eureka.instance.metadata-map.
      - source_labels: [__meta_eureka_app_instance_metadata_prometheus_path]
        regex: .+
        action: keep
      - source_labels: [__meta_eureka_app_instance_metadata_prometheus_path]
        target_label: __metrics_path__
      - source_labels: [__meta_eureka_app_name]
        target_label: application
        action: lowercase
      # Service đang chạy trên máy thật, IP đăng ký Eureka có thể không gọi được từ container.
      # Bỏ rule này khi các service cũng chạy trong cùng mạng Docker với Prometheus.
      - source_labels: [__meta_eureka_app_instance_port]
        target_label: __address__
        replacement: host.docker.internal:$1
