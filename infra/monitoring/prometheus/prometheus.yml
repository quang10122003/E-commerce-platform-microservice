services:
  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: ecom-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Cho phép nạp lại cấu hình bằng POST /-/reload mà không cần restart container.
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Docker Desktop đã có sẵn host.docker.internal; dòng này để Linux cũng gọi được Eureka và service chạy trên máy thật.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecommerce-net
    restart: unless-stopped

volumes:
  # Giữ tên volume cũ của project ecommerce-monitoring để không mất số liệu đã thu thập.
  prometheus-data:
    name: ecommerce-monitoring_prometheus-data

networks:
  # Mọi file thành phần khai báo giống nhau để compose gộp thành một mạng chung.
  ecommerce-net:
    name: ecommerce-net
    driver: bridge
