# Notification policy: QUY TẮC gửi cảnh báo tới contact point nào và gửi lúc nào.
apiVersion: 1

policies:
  - orgId: 1
    receiver: Telegram      # Policy mặc định: mọi cảnh báo không khớp quy tắc riêng đều gửi về Telegram
    group_by: [alertname]   # Gom các service cùng lỗi (cùng tên luật) vào một tin thay vì mỗi service một tin
    group_wait: 15s         # Chờ 15 giây trước tin đầu tiên để gom các cảnh báo xảy ra cùng lúc
    group_interval: 5m      # Nhóm đã gửi rồi mà có thêm service lỗi thì chờ tối đa 5 phút mới gửi tin cập nhật
    repeat_interval: 4h     # Lỗi vẫn còn thì nhắc lại sau 4 giờ, tránh spam
