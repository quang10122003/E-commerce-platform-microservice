services:
  grafana:
    image: grafana/grafana:13.2.4
    container_name: ecom-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    ports:
      - "3001:3000"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - ecommerce-net
    restart: unless-stopped

volumes:
  # Giữ tên volume cũ của project ecommerce-monitoring để không mất cấu hình Grafana đã lưu.
  grafana-data:
    name: ecommerce-monitoring_grafana-data

networks:
  # Mọi file thành phần khai báo giống nhau để compose gộp thành một mạng chung.
  ecommerce-net:
    name: ecommerce-net
    driver: bridge
