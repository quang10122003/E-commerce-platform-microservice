services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: ecom-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Không đặt thì Elasticsearch tự lấy heap theo bộ nhớ máy, dễ chiếm hết RAM của Docker.
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Cho phép Elasticvue trên trình duyệt gọi thẳng vào Elasticsearch.
      http.cors.enabled: "true"
      http.cors.allow-origin: http://localhost:8090
      http.cors.allow-headers: X-Requested-With,Content-Type,Content-Length,Authorization
      http.cors.allow-methods: GET,POST,PUT,DELETE,OPTIONS,HEAD
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  es-data:

networks:
  # Mọi file thành phần khai báo giống nhau để compose gộp thành một mạng chung.
  ecommerce-net:
    name: ecommerce-net
    driver: bridge
