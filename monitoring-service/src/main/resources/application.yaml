server:
  port: 8085

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: monitoring-service
  threads:
    virtual:
      # Kiểm tra health chủ yếu chờ mạng; executor mặc định chạy mỗi tác vụ trên virtual thread, không giới hạn pool.
      enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    # Cần thấy cả instance DOWN để hiển thị; service này không gọi qua load balancer nên không ảnh hưởng định tuyến.
    filter-only-up-instances: false
    registry-fetch-interval-seconds: 10
    healthcheck:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-components: always
      show-details: never
      group:
        eureka:
          # Không phụ thuộc DB hay cache nên chỉ xét tài nguyên máy; không có thành phần optional.
          include:
            - diskSpace
            - ping

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
  monitoring:
    # Instance treo không được giữ cả API tổng hợp quá lâu.
    request-timeout: 5s
    # Service chết sẽ bị Eureka gỡ khỏi registry; khai báo danh sách mong đợi để trả MISSING thay vì biến mất khỏi UI.
    expected-services:
      - discovery-server
      - getway
      - auth-service
      - producr-service
      - order-service
      - notification-service
