server:
  port: 8080

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: getway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # WebSocket upgrade đi riêng, không bọc response hoặc xử lý frame như HTTP JSON.
            - id: notification-websocket
              uri: lb:ws://notification-service
              predicates:
                - Path=/ws-notifications,/ws-notifications/**

            # Các API chat, bao gồm cấp vé, giữ kiểm soát JWT qua luồng HTTP hiện có.
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/chat/**
              filters:
                - name: ApiResponse

            # Auth Service
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**,/api/internal/shops/*/info
              filters:
                - name: ApiResponse

            # Product Service
            - id: product-service
              uri: lb://producr-service
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/brands/**,/api/internal/**,/api/admin/flash-sales,/api/admin/flash-sales/**,/api/shop/flash-sales,/api/shop/flash-sales/**,/api/user/flash-sales,/api/user/flash-sales/**
              filters:
                - name: ApiResponse

            # Chuyển tiếp các API giỏ hàng đến order-service.
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/cart,/api/cart/**
              filters:
                - name: ApiResponse
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true

  instance:
    prefer-ip-address: true
    # Rút ngắn thời gian chờ để Eureka bỏ instance đã tắt nhanh hơn.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

