server:
  port: 8080

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: getway

  http:
    codecs:
      max-in-memory-size: ${GATEWAY_MAX_IN_MEMORY_SIZE:32MB}

  cloud:
    loadbalancer:
      cache:
        # Giữ TTL ngắn tương ứng chu kỳ lấy registry để không gọi vào instance cũ quá lâu.
        ttl: 10s
    gateway:
      server:
        webflux:
          routes:
            # Stream SSE phải được truyền thẳng để tránh bộ lọc JSON giữ toàn bộ response.
            - id: notification-sse
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/checkouts/*/stream

            # WebSocket upgrade đi riêng, không bọc response hoặc xử lý frame như HTTP JSON.
            - id: notification-websocket
              uri: lb:ws://notification-service
              predicates:
                - Path=/ws-notifications,/ws-notifications/**

            # Các API chat, bao gồm cấp vé, giữ kiểm soát JWT qua luồng HTTP hiện có.
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/chat/**,/api/banners,/api/banners/**
              filters:
                - name: ApiResponse

            # Màn hình giám sát trạng thái hệ thống, chỉ admin được gọi.
            - id: monitoring-service
              uri: lb://monitoring-service
              predicates:
                - Path=/api/admin/system-status
              filters:
                - name: ApiResponse

            # Auth Service
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**,/api/users,/api/users/**,/api/internal/shops/*/info,/api/internal/shop-info,/api/internal/shops/statuses
              filters:
                - name: ApiResponse

            # Product Service
            - id: product-service
              uri: lb://producr-service
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/brands/**,/api/internal/**,/api/admin/flash-sales,/api/admin/flash-sales/**,/api/shop/flash-sales,/api/shop/flash-sales/**,/api/user/flash-sales,/api/user/flash-sales/**
              filters:
                - name: ApiResponse

            # VNPay đọc body thô {RspCode, Message}, nên IPN không được bọc qua ApiResponse.
            - id: order-service-vnpay-ipn
              uri: lb://order-service
              predicates:
                - Path=/api/payments/vnpay/ipn

            # Giỏ hàng và checkout cùng thuộc Order Service.
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/cart,/api/cart/**,/api/checkouts,/api/checkouts/**
              filters:
                - name: ApiResponse
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    # Lấy registry thường xuyên hơn để phía gọi sớm bỏ instance đã DOWN hoặc đã tắt.
    registry-fetch-interval-seconds: 10

  instance:
    prefer-ip-address: true
    metadata-map:
      # Prometheus đọc metadata này từ Eureka để biết đường dẫn lấy số liệu của instance.
      "[prometheus.path]": /actuator/prometheus
    # Rút ngắn thời gian chờ để Eureka bỏ instance đã tắt nhanh hơn.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  prometheus:
    metrics:
      export:
        # Mặc định đã bật khi có micrometer-registry-prometheus; ghi rõ để dễ nhận biết và tắt riêng khi cần.
        enabled: true
  metrics:
    tags:
      # Gắn tên service vào mọi số liệu để Prometheus và Grafana lọc theo từng service.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Xuất histogram để tính được độ trễ p95/p99 trên Prometheus.
        "[http.server.requests]": true
  endpoint:
    health:
      # Hiện trạng thái từng indicator để biết ngay nguyên nhân DOWN; vẫn giấu chi tiết để không lộ cấu hình hạ tầng.
      show-components: always
      show-details: never
      group:
        eureka:
          # Redis là bắt buộc vì gateway từ chối request có token khi không kiểm tra được thu hồi token; không có thành phần optional.
          include:
            - redis
            - diskSpace
            - ping
