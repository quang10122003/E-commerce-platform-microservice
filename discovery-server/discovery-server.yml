# Chạy riêng service: docker compose -f discovery-server/discovery-server.yml up -d --build
services:
  discovery-server:
    build:
      # Context là gốc repo để Dockerfile copy được module common.
      context: ..
      dockerfile: discovery-server/Dockerfile
    image: ecommerce/discovery-server:latest
    container_name: ecom-discovery-server
    env_file: .env
    environment:
      # Ghi đè giá trị local trong .env để service dùng địa chỉ container trong application-docker.yaml.
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    networks:
      - ecommerce-net
    # Tự khởi động lại khi bật lên lúc MySQL, Kafka hay Eureka chưa sẵn sàng.
    deploy:
      resources:
        limits:
          # Chặn một JVM chiếm quá nhiều RAM khi chạy cả hệ thống trên máy dev.
          memory: 768m
    healthcheck:
      # Actuator yêu cầu quyền admin; /eureka/apps mở cho client nên dùng để biết Eureka đã nhận đăng ký.
      test: ["CMD-SHELL", "curl -fs -H 'Accept: application/json' http://localhost:8761/eureka/apps > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: on-failure

networks:
  # Khai báo giống infra: chạy chung thì gộp một mạng, chạy riêng thì dùng lại mạng đã có hoặc tự tạo.
  ecommerce-net:
    name: ecommerce-net
    driver: bridge
