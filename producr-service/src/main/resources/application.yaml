spring:
  application:
    name: producr-service
  cloud:
    loadbalancer:
      cache:
        # Giữ TTL ngắn tương ứng chu kỳ lấy registry để không gọi vào instance cũ quá lâu.
        ttl: 10s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${PRODUCT_KAFKA_CONSUMER_GROUP:product-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        # Chờ tối đa 5 mili giây để gom thêm message cùng partition.
        linger.ms: 5
  config:
    import:
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/product_service_db
    username: ${USERNAME_DATABASE}
    password: ${PASSWORD_DATABASE}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+07:00'"
  jpa:
    properties:
      hibernate:
        # Hibernate mặc định ghi Instant theo giờ UTC, lệch với phiên MySQL +07 ở trên; ép cùng múi giờ.
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  prometheus:
    metrics:
      export:
        # Mặc định đã bật khi có micrometer-registry-prometheus; ghi rõ để dễ nhận biết và tắt riêng khi cần.
        enabled: true
  metrics:
    tags:
      # Gắn tên service vào mọi số liệu để Prometheus và Grafana lọc theo từng service.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Xuất histogram để tính được độ trễ p95/p99 trên Prometheus.
        "[http.server.requests]": true
  endpoint:
    health:
      # Hiện trạng thái từng indicator để biết ngay nguyên nhân DOWN; vẫn giấu chi tiết để không lộ cấu hình hạ tầng.
      show-components: always
      show-details: never
      group:
        eureka:
          # Redis và Elasticsearch chỉ phục vụ cache, tìm kiếm, gợi ý nên lỗi không được làm cả service DOWN trên Eureka.
          include:
            - db
            - diskSpace
            - ping
        optional:
          # Thành phần không bắt buộc, chỉ để UI giám sát hiển thị; không ảnh hưởng trạng thái Eureka.
          include:
            - redis
            - elasticsearch

server:
  port: 8083

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    # Lấy registry thường xuyên hơn để phía gọi sớm bỏ instance đã DOWN hoặc đã tắt.
    registry-fetch-interval-seconds: 10
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    metadata-map:
      # Prometheus đọc metadata này từ Eureka để biết đường dẫn lấy số liệu của instance.
      "[prometheus.path]": /actuator/prometheus
    # Rút ngắn thời gian chờ để Eureka bỏ instance đã tắt nhanh hơn.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  embedding:
    gemini:
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-embedding-2
      api-key: ${GEMINI_API_KEY}
      connect-timeout: 5s
      read-timeout: 30s
  recommendation:
    top-selling:
      cache-ttl: 1h
#    cấu hình clean hành vi người dùng quá hạn
    behavior-cleanup:
      cron: "0 0 2 * * *"
      batch-size: 1000
  kafka:
    consumer:
      retry-interval-ms: 60000
      retry-increment-ms: 300000
      max-retries: 3
      dlt-partitions: 3
      dlt-replicas: 1
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
  outbox:
    fixed-delay-ms: 2000
  flash-sale:
    status-fixed-delay-ms: 5000
supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_SECRET_KEY}
