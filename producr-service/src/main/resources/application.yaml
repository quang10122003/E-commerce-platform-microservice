spring:
  application:
    name: producr-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        # Chờ tối đa 5 mili giây để gom thêm message cùng partition.
        linger.ms: 5
  config:
    import:
      # Nạp biến môi trường từ .env ở cả root project và thư mục cha của module
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/product_service_db
    username: ${USERNAME_DATABASE}
    password: ${PASSWORD_DATABASE}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+07:00'"

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

server:
  port: 8083

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    # Rút ngắn thời gian chờ để Eureka bỏ instance đã tắt nhanh hơn.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}
  outbox:
    fixed-delay-ms: ${PRODUCT_OUTBOX_FIXED_DELAY_MS:5000}
  flash-sale:
    status-fixed-delay-ms: 10000
supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_SECRET_KEY}
