spring:
  config:
    import:
      # Nạp biến môi trường từ .env ở cả root project và thư mục cha của module
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: ${USERNAME_DATABASE}
    password: ${PASSWORD_DATABASE}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+07:00'"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        # Chờ tối đa 5 mili giây để gom thêm message cùng partition.
        linger.ms: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  prometheus:
    metrics:
      export:
        # Mặc định đã bật khi có micrometer-registry-prometheus; ghi rõ để dễ nhận biết và tắt riêng khi cần.
        enabled: true
  metrics:
    tags:
      # Gắn tên service vào mọi số liệu để Prometheus và Grafana lọc theo từng service.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Xuất histogram để tính được độ trễ p95/p99 trên Prometheus.
        "[http.server.requests]": true
  endpoint:
    health:
      # Hiện trạng thái từng indicator để biết ngay nguyên nhân DOWN; vẫn giấu chi tiết để không lộ cấu hình hạ tầng.
      show-components: always
      show-details: never
      group:
        eureka:
          # Redis chỉ lưu blacklist token và trạng thái khóa nên lỗi không được làm login DOWN trên Eureka.
          include:
            - db
            - diskSpace
            - ping
        optional:
          # Thành phần không bắt buộc, chỉ để UI giám sát hiển thị; không ảnh hưởng trạng thái Eureka.
          include:
            - redis

server:
  port: 8081

eureka:
  client:
    register-with-eureka: true   
    fetch-registry: true
    healthcheck:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    metadata-map:
      # Prometheus đọc metadata này từ Eureka để biết đường dẫn lấy số liệu của instance.
      "[prometheus.path]": /actuator/prometheus
    # Rút ngắn thời gian chờ để Eureka bỏ instance đã tắt nhanh hơn.
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  kafka:
    publisher:
      fixed-delay-ms: 10000

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_SECRET_KEY}
